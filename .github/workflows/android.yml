name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты и сборка APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk VsatStar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VsatStar-apk
          path: android/VsatStar.apk
