name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты и сборка APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk VsatStar.apk

      - name: Скриншоты тем
        run: |
          mkdir -p screenshots
          for f in app/build/screenshots/*.png; do cp "$f" "screenshots/screen_$(basename "$f")"; done
          ls screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: VsatStar-apk
          path: android/VsatStar.apk

      # Постоянная ссылка для телефона:
      # https://github.com/dima0090142-lgtm/vsat-star/releases/download/android-latest/VsatStar.apk
      # Pre-release, чтобы не мешать проверке обновлений Windows-версии (releases/latest).
      - name: Выложить APK в релиз android-latest
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: VSAT STAR для Android
          prerelease: true
          make_latest: false
          body: |
            Последняя сборка Android-приложения (коммит ${{ github.sha }}).
            Скачайте VsatStar.apk на телефон и установите.
          files: |
            android/VsatStar.apk
            android/screenshots/*.png
          fail_on_unmatched_files: true
